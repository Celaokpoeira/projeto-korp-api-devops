version: '3.8'

networks:
  korp-network:
    driver: bridge

services:
  http-server-projeto-korp:
    build: .
    container_name: http-server-projeto-korp
    networks:
      - korp-network
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    networks:
      - korp-network
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - korp-network
    ports:
      - "9090:9090"
    volumes:
      - ./http-server-projeto-korp.conf:/etc/nginx/conf.d/default.conf
    restart: always

 grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - korp-network
    ports:
      - "3000:3000"
    volumes:
      - ./datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./http-server-projeto-korp-dashboard.json:/etc/grafana/provisioning/dashboards/http-server-projeto-korp-dashboard.json
    restart: always
